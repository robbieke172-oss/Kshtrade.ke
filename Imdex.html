<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertex · Trading Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0e14;
      color: #e8edf5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* main dashboard card */
    .dashboard {
      max-width: 1440px;
      width: 100%;
      background: #11161f;
      border-radius: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.03);
      padding: 24px;
      backdrop-filter: blur(2px);
      transition: all 0.2s ease;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      background: linear-gradient(145deg, #3b82f6, #2563eb);
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 8px 18px -6px #2563eb80;
    }

    .logo-text {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(to right, #ffffff, #b9c7e0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-box {
      background: #1a1f2b;
      border-radius: 40px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #252c3a;
      transition: border 0.2s;
    }

    .search-box i {
      color: #7f8b9f;
      font-size: 14px;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #e8edf5;
      font-size: 14px;
      font-weight: 400;
      width: 180px;
    }

    .search-box input::placeholder {
      color: #5c6678;
    }

    .search-box:focus-within {
      border-color: #3b82f6;
    }

    .avatar {
      background: #1e2533;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #b9c7e0;
      border: 1px solid #2c3444;
      cursor: pointer;
      transition: 0.2s;
    }

    .avatar:hover {
      border-color: #3b82f6;
      background: #252e3e;
    }

    /* main grid */
    .main-grid {
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 22px;
      margin-bottom: 22px;
    }

    /* chart card */
    .chart-card {
      background: #141a24;
      border-radius: 22px;
      padding: 22px 22px 18px;
      border: 1px solid #222b38;
      box-shadow: 0 10px 20px -8px #00000060;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .pair-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .pair-name {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pair-name span {
      background: #1f2937;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 40px;
      color: #9aa8bf;
      letter-spacing: 0.3px;
    }

    .price-large {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .current-price {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .price-change {
      font-size: 16px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 40px;
      background: #0f2a1f;
      color: #4ade80;
    }

    .price-change.negative {
      background: #2a1215;
      color: #f87171;
    }

    .timeframe {
      display: flex;
      gap: 6px;
      background: #1a1f2b;
      padding: 4px;
      border-radius: 40px;
      border: 1px solid #252c3a;
    }

    .timeframe button {
      background: transparent;
      border: none;
      color: #8b98af;
      font-weight: 500;
      font-size: 13px;
      padding: 6px 16px;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .timeframe button.active {
      background: #2a3346;
      color: white;
      font-weight: 600;
    }

    .timeframe button:hover:not(.active) {
      color: #cdd9ec;
    }

    /* canvas chart container */
    .chart-container {
      position: relative;
      width: 100%;
      height: 210px;
      margin: 10px 0 18px;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 12px;
    }

    /* order book + trades */
    .order-book-card {
      background: #141a24;
      border-radius: 22px;
      padding: 22px 18px;
      border: 1px solid #222b38;
      box-shadow: 0 10px 20px -8px #00000060;
      display: flex;
      flex-direction: column;
    }

    .order-book-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .order-book-header h3 {
      font-size: 16px;
      font-weight: 600;
      color: #b9c7e0;
      letter-spacing: 0.2px;
    }

    .order-book-header i {
      color: #5f6b82;
      font-size: 14px;
    }

    .order-book-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: #1a1f2b;
      padding: 4px;
      border-radius: 40px;
      border: 1px solid #252c3a;
    }

    .order-book-tabs button {
      flex: 1;
      background: transparent;
      border: none;
      color: #8b98af;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 0;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.2s;
    }

    .order-book-tabs button.active {
      background: #2a3346;
      color: white;
      font-weight: 600;
    }

    .order-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .order-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 10px;
      background: #10161f;
      transition: 0.15s;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .order-row .price {
      color: #e8edf5;
      font-weight: 600;
    }

    .order-row .amount {
      color: #94a3b8;
    }

    .order-row.ask .price {
      color: #f87171;
    }

    .order-row.bid .price {
      color: #4ade80;
    }

    .spread-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 10px;
      margin: 4px 0;
      background: #1a212e;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      border-top: 1px solid #2c3444;
      border-bottom: 1px solid #2c3444;
    }

    .spread-row span:first-child {
      color: #94a3b8;
    }

    .spread-row span:last-child {
      color: #e8edf5;
    }

    /* bottom panel */
    .bottom-panel {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 22px;
      margin-top: 4px;
    }

    /* trade panel */
    .trade-panel {
      background: #141a24;
      border-radius: 22px;
      padding: 22px 18px;
      border: 1px solid #222b38;
      box-shadow: 0 10px 20px -8px #00000060;
    }

    .trade-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .trade-header h3 {
      font-size: 16px;
      font-weight: 600;
      color: #b9c7e0;
    }

    .trade-tabs {
      display: flex;
      gap: 6px;
    }

    .trade-tabs button {
      background: #1a1f2b;
      border: none;
      color: #8b98af;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.2s;
    }

    .trade-tabs button.active-buy {
      background: #0f2a1f;
      color: #4ade80;
    }

    .trade-tabs button.active-sell {
      background: #2a1215;
      color: #f87171;
    }

    .trade-input-group {
      margin-bottom: 18px;
    }

    .trade-input-group label {
      display: block;
      font-size: 13px;
      color: #8b98af;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .input-wrapper {
      background: #1a1f2b;
      border: 1px solid #252c3a;
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: #3b82f6;
    }

    .input-wrapper input {
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 18px;
      font-weight: 600;
      width: 70%;
      letter-spacing: -0.2px;
    }

    .input-wrapper span {
      color: #7f8b9f;
      font-size: 14px;
      font-weight: 500;
    }

    .quick-percent {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .quick-percent button {
      background: #1a1f2b;
      border: 1px solid #252c3a;
      color: #b9c7e0;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.15s;
    }

    .quick-percent button:hover {
      background: #252e3e;
      border-color: #3b82f6;
    }

    .action-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 16px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: 0.15s;
      margin-top: 6px;
    }

    .buy-btn {
      background: #0f2a1f;
      color: #4ade80;
      border: 1px solid #1e4a2e;
    }

    .buy-btn:hover {
      background: #143d2a;
      box-shadow: 0 8px 18px -8px #22c55e60;
    }

    .sell-btn {
      background: #2a1215;
      color: #f87171;
      border: 1px solid #4a1e24;
    }

    .sell-btn:hover {
      background: #3d1a20;
      box-shadow: 0 8px 18px -8px #ef444460;
    }

    /* recent trades */
    .trades-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .trades-list::-webkit-scrollbar {
      width: 4px;
    }

    .trades-list::-webkit-scrollbar-thumb {
      background: #2c3444;
      border-radius: 10px;
    }

    .trade-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 10px;
      background: #10161f;
      font-size: 13px;
      font-weight: 500;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .trade-item .price-buy {
      color: #4ade80;
    }

    .trade-item .price-sell {
      color: #f87171;
    }

    .trade-item .time {
      color: #5f6b82;
      font-size: 12px;
    }

    /* stats row */
    .stats-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat-item {
      background: #10161f;
      padding: 12px 16px;
      border-radius: 16px;
      flex: 1;
      min-width: 100px;
      border: 1px solid #1e2533;
    }

    .stat-label {
      font-size: 12px;
      color: #7f8b9f;
      margin-bottom: 6px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: #e8edf5;
    }

    .stat-value.green {
      color: #4ade80;
    }

    .stat-value.red {
      color: #f87171;
    }

    /* responsive */
    @media (max-width: 1024px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
      .bottom-panel {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .dashboard {
        padding: 16px;
      }
      .header {
        flex-direction: column;
        align-items: stretch;
      }
      .header-actions {
        justify-content: space-between;
      }
      .search-box input {
        width: 120px;
      }
      .chart-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .current-price {
        font-size: 26px;
      }
      .pair-name {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <!-- Header -->
    <div class="header">
      <div class="logo-area">
        <div class="logo-icon"><i class="fas fa-chart-line"></i></div>
        <div class="logo-text">Vertex</div>
      </div>
      <div class="header-actions">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search markets...">
        </div>
        <div class="avatar">AJ</div>
      </div>
    </div>

    <!-- Stats row -->
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-label">24h Volume</div>
        <div class="stat-value">$2.84B</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">24h High</div>
        <div class="stat-value">$67,420</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">24h Low</div>
        <div class="stat-value">$63,180</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Funding Rate</div>
        <div class="stat-value green">+0.012%</div>
      </div>
    </div>

    <!-- Main grid: chart + order book -->
    <div class="main-grid">
      <!-- Chart card -->
      <div class="chart-card">
        <div class="chart-header">
          <div class="pair-info">
            <div class="pair-name">
              BTC/USDT <span>PERP</span>
            </div>
          </div>
          <div class="timeframe">
            <button>1m</button>
            <button>5m</button>
            <button class="active">15m</button>
            <button>1H</button>
            <button>4H</button>
            <button>1D</button>
          </div>
        </div>
        <div class="price-large">
          <div class="current-price" id="currentPrice">$64,892.50</div>
          <div class="price-change" id="priceChange">+2.34%</div>
        </div>
        <div class="chart-container">
          <canvas id="priceChart" width="800" height="210"></canvas>
        </div>
        <div class="stats-row" style="margin-bottom: 0;">
          <div class="stat-item">
            <div class="stat-label">Open Interest</div>
            <div class="stat-value">$1.24B</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Liq. (24h)</div>
            <div class="stat-value red">$42.8M</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Long/Short</div>
            <div class="stat-value">1.24</div>
          </div>
        </div>
      </div>

      <!-- Order book card -->
      <div class="order-book-card">
        <div class="order-book-header">
          <h3>Order Book</h3>
          <i class="fas fa-sliders-h"></i>
        </div>
        <div class="order-book-tabs">
          <button class="active">Both</button>
          <button>Bids</button>
          <button>Asks</button>
        </div>
        <div class="order-list" id="askList">
          <!-- populated by JS -->
        </div>
        <div class="spread-row">
          <span>Spread</span>
          <span id="spreadValue">$8.20</span>
        </div>
        <div class="order-list" id="bidList">
          <!-- populated by JS -->
        </div>
      </div>
    </div>

    <!-- Bottom panel: trade form + recent trades -->
    <div class="bottom-panel">
      <!-- Trade panel -->
      <div class="trade-panel">
        <div class="trade-header">
          <h3>Place Order</h3>
          <div class="trade-tabs">
            <button class="active-buy" id="buyTab">Buy</button>
            <button id="sellTab">Sell</button>
          </div>
        </div>
        <div class="trade-input-group">
          <label>Price</label>
          <div class="input-wrapper">
            <input type="text" value="64,892.50" id="priceInput">
            <span>USDT</span>
          </div>
        </div>
        <div class="trade-input-group">
          <label>Amount</label>
          <div class="input-wrapper">
            <input type="text" value="0.25" id="amountInput">
            <span>BTC</span>
          </div>
          <div class="quick-percent">
            <button>25%</button>
            <button>50%</button>
            <button>75%</button>
            <button>100%</button>
          </div>
        </div>
        <button class="action-btn buy-btn" id="actionBtn">Buy BTC</button>
      </div>

      <!-- Recent trades -->
      <div class="trade-panel">
        <div class="trade-header">
          <h3>Recent Trades</h3>
          <i class="fas fa-history" style="color:#5f6b82;"></i>
        </div>
        <div class="trades-list" id="tradesList">
          <!-- populated by JS -->
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // --- Chart drawing (realistic candlestick / line) ---
      const canvas = document.getElementById('priceChart');
      const ctx = canvas.getContext('2d');

      // generate realistic price data
      const basePrice = 64892.50;
      const points = 48; // number of candles
      const data = [];
      let price = basePrice - 800;
      for (let i = 0; i < points; i++) {
        const change = (Math.random() - 0.48) * 400;
        price = Math.max(63000, Math.min(66800, price + change));
        const high = price + Math.random() * 200;
        const low = price - Math.random() * 200;
        const open = i === 0 ? price - 100 : data[i-1].close;
        const close = price;
        data.push({ open, high, low, close });
      }

      // update current price display based on last close
      const lastClose = data[data.length-1].close;
      document.getElementById('currentPrice').innerText = '$' + lastClose.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      
      const firstOpen = data[0].open;
      const changePercent = ((lastClose - firstOpen) / firstOpen * 100);
      const changeEl = document.getElementById('priceChange');
      changeEl.innerText = (changePercent >= 0 ? '+' : '') + changePercent.toFixed(2) + '%';
      if (changePercent < 0) {
        changeEl.classList.add('negative');
      } else {
        changeEl.classList.remove('negative');
      }

      // Draw chart
      function drawChart() {
        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        // find min/max for scaling
        let min = Infinity, max = -Infinity;
        data.forEach(d => {
          if (d.low < min) min = d.low;
          if (d.high > max) max = d.high;
        });
        const padding = 20;
        min = min - 50;
        max = max + 50;
        const range = max - min;

        const candleWidth = w / points * 0.7;
        const spacing = w / points;

        // background grid
